name: Build PMB110 LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 下载你的仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装系统编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip unzip rsync device-tree-compiler libncurses5-dev

      - name: 3. 下载指定版本的 Clang r536225
        run: |
          cd ..
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r536225.tar.gz
          mkdir -p clang-r536225 && tar -xzf clang-r536225.tar.gz -C clang-r536225
          echo "CLANG_PATH=$(pwd)/clang-r536225/bin" >> $GITHUB_ENV

      - name: 4. 下载内核源码 (指定 commit)
        run: |
          cd ..
          git clone --depth 1 https://github.com/OnePlusOSS/android_kernel_oneplus_mt6993.git kernel_src
          cd kernel_src
          git fetch --depth 1 origin 2e3b6d890bd2c7bd5779bef6df6e16e2c972b87c
          git checkout 2e3b6d890bd2c7bd5779bef6df6e16e2c972b87c

      - name: 5. 下载显示模块源码 (指定 commit)
        run: |
          cd ..
          git clone --depth 1 https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_mt6993.git display_src
          cd display_src
          git fetch --depth 1 origin 2cc7f4606b65a9ede42030ee82614dd845b665a1
          git checkout 2cc7f4606b65a9ede42030ee82614dd845b665a1

      - name: 6. 放入手机配置并生成头文件
        run: |
          cd ../kernel_src
          cp $GITHUB_WORKSPACE/.config .
          make ARCH=arm64 CC=$CLANG_PATH/clang oldconfig
          make ARCH=arm64 CC=$CLANG_PATH/clang modules_prepare

      - name: 7. 开始编译 .ko 文件
        run: |
          export PMB110_HEADERS_DIR=$(pwd)/../kernel_src
          export PMB110_KERNEL_SOURCE=$(pwd)/../kernel_src
          export PMB110_DISPLAY_ROOT=$(pwd)/../display_src
          export PMB110_CLANG=$CLANG_PATH/clang
          export PMB110_CLANG_PATH=$CLANG_PATH
          export PMB110_LLD_PATH=$CLANG_PATH/ld.lld
          export PMB110_SHORT=1
          
          sh scripts/build_module.sh

      - name: 8. 打包上传编译好的 .ko 文件
        uses: actions/upload-artifact@v4
        with:
          name: PMB110-185-Mode-KO
          path: out/*.ko
